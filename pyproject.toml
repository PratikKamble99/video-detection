[project]
name = "rt-perception"
version = "0.1.0"
description = "Real-time video object detection + audio captioning + AI reasoning pipeline"
requires-python = ">=3.12"
# Phase 0 core: measurement, event contract, ring buffer, bus. No ML yet.
dependencies = [
    "numpy>=1.26",
    "pyzmq>=26.0",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Phase 1 video path: capture + detect + track + overlay. CPU torch works;
# ultralytics brings YOLO11 and a built-in ByteTrack. Runs the live webcam demo.
video = [
    "opencv-python>=4.9",
    "ultralytics>=8.2",
]
# Phase 6 GPU/ONNX acceleration. NOTE: TensorRT is intentionally NOT listed here
# — its wheels only resolve on an NVIDIA box and would break `uv lock` elsewhere.
# On a GPU machine: `uv pip install tensorrt onnxruntime-gpu` manually.
gpu = [
    "onnxruntime>=1.17",
]
# Phase 2 audio.
audio = [
    "sounddevice>=0.4",
    "faster-whisper>=1.0",
    "silero-vad>=5.0",
]
# Phase 3+ fusion / memory.
fusion = [
    "faiss-cpu>=1.8",
]
# Phase 5 reasoning.
reasoning = [
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "video", "audio", "fusion", "reasoning", "sinks", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Keep the lockfile resolvable without GPU wheels present in CI.
